    .chat-head p{margin-top:2px}

    @keyframes bob{to{transform:scale(.72) translateY(-5px)}}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 0 5px #2b956822}}
    @media(max-width:900px){.app{grid-template-columns:1fr}.runs{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.runs h2{display:none}.run-list{flex-direction:row;overflow-x:auto}.run-item{min-width:170px}.workspace{grid-template-columns:1fr}.workbench{border-right:0;border-bottom:1px solid var(--line)}.inspector{min-height:220px}}
    @media(max-width:650px){.topbar{height:auto;min-height:64px;padding:8px 14px;flex-wrap:wrap}.brand{display:none}.top-actions{min-width:0;flex-wrap:wrap;justify-content:flex-end;gap:6px}.human-toggle{font-size:11px}.new-test,.join-human{padding:0 10px}.main{padding:16px 14px 28px}.run-status{display:none}.metrics,.result-grid,.relationship-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{border-bottom:1px solid var(--line)}.metric:nth-child(2n){border-right:0}.metric:last-child{grid-column:1/-1;border-bottom:0}.agents{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{padding-left:8px}.feed-head{align-items:flex-start;flex-direction:column;gap:5px}.relationship-choice{align-items:flex-start;flex-direction:column;gap:7px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
    .network-person{margin-top:12px;padding:12px 0 6px;border-top:1px solid var(--line);font-size:15px;font-weight:760;letter-spacing:-.015em}.network-person:first-child{margin-top:0;border-top:0}.network-heading{margin-top:2px;padding:7px 2px 2px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.network-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.network-row strong{font-size:13px}.network-row span{max-width:68%;color:var(--muted);font:500 10px/1.45 ui-monospace,monospace;text-align:right}.network-empty{padding:10px 12px;border:1px dashed var(--line);border-radius:7px;color:var(--muted);font-size:11px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" role="img" aria-label="Zenblox"></div>
    <div class="brand">ZB Agent Lab</div>
    <div class="top-actions">
      <button id="run-agent-test" class="new-test" type="button" data-idle-label="New agent test">New test</button>
      <span id="run-status" class="run-status" role="status">Loading</span>
    </div>
  </header>
  <div class="app">
    <aside class="runs" aria-labelledby="runs-title">
      <h2 id="runs-title">Runs</h2>
      <nav id="run-list" class="run-list" aria-label="Test runs"></nav>
    </aside>
    <main class="main">
      <header class="run-head">
        <div><h1 id="run-title">No runs yet</h1><p id="run-participants"></p></div>
      </header>
      <dl class="metrics" aria-label="Run metrics">
        <div class="metric"><dt>Participants</dt><dd data-count="participants">0</dd></div>
        <div class="metric"><dt>Questions created</dt><dd data-count="questions">0</dd></div>
        <div class="metric"><dt>Answer submissions</dt><dd data-count="answers">0</dd></div>
        <div class="metric"><dt>Shares</dt><dd data-count="shares">0</dd></div>
        <div class="metric"><dt>Findings</dt><dd data-count="findings">0</dd></div>
      </dl>
      <section id="profile-cards" class="agents" aria-label="Profiles"></section>
      <section class="workspace" aria-label="Run evaluation">
        <div class="workbench">
          <div id="view-tabs" class="tabs" role="group" aria-label="Run views">
            <button class="tab" type="button" data-view="overview" aria-pressed="true">Overview</button>
            <button class="tab" type="button" data-view="network" aria-pressed="false">People &amp; friends</button>
            <button class="tab" type="button" data-view="relationships" aria-pressed="false">Relationships</button>
            <button class="tab" type="button" data-view="questions" aria-pressed="false">Questions</button>
            <button class="tab" type="button" data-view="followups" aria-pressed="false">Follow-ups</button>
            <button class="tab" type="button" data-view="findings" aria-pressed="false">Findings</button>
            <button class="tab" type="button" data-view="activity" aria-pressed="false">Activity</button>
            <button class="tab" type="button" data-view="chat" aria-pressed="false">Chat</button>
          </div>
          <header class="feed-head"><h2 id="view-title">Run overview</h2><span id="filter-note" class="filter-note">Judge summary</span></header>
          <ol id="event-feed" class="event-feed" aria-labelledby="view-title"></ol>
          <aside id="chat-panel" class="chat-panel" hidden aria-label="Test results chat">
            <form id="chat-form" class="chat-form">
              <label class="sr-only" for="chat-input">Question about this test</label>
              <input id="chat-input" class="chat-input" type="text" maxlength="1000" placeholder="Why was the memory score low?" autocomplete="off">
              <button id="chat-send" class="chat-send" type="submit">Send</button>
            </form>
            <ol id="chat-messages" class="chat-messages"><li class="chat-empty">Ask about scores, answers, leaks or agent behaviour.</li></ol>
          </aside>
        </div>
        <aside class="inspector" aria-labelledby="event-title">
          <h2 id="event-title">No event selected</h2>
          <div class="inspector-meta"><span id="event-actor">Q3</span><span id="event-time">--:--:--</span><span id="event-kind">System</span></div>
          <p id="event-text" class="inspector-text">Select an event.</p>
        </aside>
      </section>
    </main>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/viewer.mjs"></script>
</body>
</html>
