packages:
  - ui
  - module/questUi
  - module/*/ui
  - module/*/func
  - module/dashboard
  - module/QFF/QFFViz
  - module/QFF/QFFIdentity
  - module/QFF/QFFModeler
  - module/QFF/QFFMatcher
  - module/QFF/QFFLineage
  - module/QFF/IdentityRepository
  - module/QFF/QFFRepository
  - external/openlineage-visualizer
  - deploy/corpSetup/c11cloudfront/source/authGuardLambdaEdge
  - deploy/corpSetup/c11cloudfront/source/msalSpa
allowBuilds:
  "@scarf/scarf": false
  azure-functions-core-tools: true
  esbuild: true
  onnxruntime-node: true
  openvino-genai-node: true
  openvino-node: true
  protobufjs: true
  sharp: true

overrides:
  react: 18.x.x
  react-router: ^7.x.x
  # openlineage-visualizer requires React 19
  "openlineage-visualizer>react": ^19.2.8
  "openlineage-visualizer>react-dom": ^19.2.8

onlyBuiltDependencies:
  - "@scarf/scarf"
  - azure-functions-core-tools
  - esbuild
  - protobufjs
  - scarf
